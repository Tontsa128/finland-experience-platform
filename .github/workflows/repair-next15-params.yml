name: Repair Next.js 15 async request APIs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Apply Next.js codemod
        run: npx @next/codemod@latest next-async-request-api . --force

      - name: Apply deterministic async params repair
        run: node scripts/repair-next15-async-params.mjs

      - name: Check for remaining synchronous route params
        run: |
          if grep -RIn --include='*.tsx' --include='*.ts' -E 'params\s*:\s*\{[^}]*\}' src/app; then
            echo "Remaining synchronous params found."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit repaired source and generated lockfile
        run: |
          git add src next-env.d.ts tsconfig.json package-lock.json
          if git diff --cached --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: complete Next.js 15 async request migration"
          git push origin main
